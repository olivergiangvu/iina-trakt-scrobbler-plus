name: Trakt+ The Season Canary (artifact only)

# Package the PR22 parser regression as an ephemeral downloadable ZIP.
# This workflow cannot create GitHub Releases, merge branches or deploy.
on:
  push:
    branches:
      - fix/v029-the-season-year-guessit-20261107

permissions:
  contents: read

jobs:
  canary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate parser and regression
        shell: bash
        run: |
          set -euo pipefail
          node --check parser.js
          node --check parser.iina.js
          node --check playback-identity.js
          node --check main.js
          node tests/parser-smoke.js
          node tests/playback-identity.js
          node - <<'NODE'
          const assert = require('node:assert/strict');
          const info = require('./Info.json');
          assert.equal(info.version, '0.2.9-beta.6');
          assert.equal(info.identifier, 'io.github.olivergiangvu.iinatraktscrobblerplus');
          NODE
      - name: Package Mac-installable extension without publishing
        shell: bash
        run: |
          set -euo pipefail
          STAGE="$(./scripts/stage-plugin.sh)"
          mkdir -p dist
          OUT="$GITHUB_WORKSPACE/dist/Trakt-Scrobbler-Plus-v0.2.9-beta.6-PR22-canary.iinaplgz"
          (cd "$STAGE" && zip -q -r "$OUT" .)
          unzip -t "$OUT" >/dev/null
          for item in Info.json main.js parser.iina.js playback-identity.js sidebar.html trakt.js; do
            unzip -Z1 "$OUT" | grep -qx "$item"
          done
          echo "Built $(basename "$OUT")"
      - name: Upload temporary canary for manual IINA installation
        uses: actions/upload-artifact@v4
        with:
          name: Trakt-Plus-PR22-IINA-Canary
          path: dist/*.iinaplgz
          if-no-files-found: error
          retention-days: 14
