name: Node smoke tests

on:
  push:
    branches: [main, 'fix/**', 'feature/**']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Shared Glass Light/Dark parity contract
        run: node tests/glass-parity.js
      - name: Stream URL tests
        run: node tests/stream-source.js
      - name: Playback metadata identity tests
        run: node tests/playback-identity.js
      - name: Trakt stop checkpoint journal tests
        run: node tests/stop-journal.js
      - name: Trakt API rate limit and outage tests
        run: node tests/trakt-api-gate.js
      - name: OAuth rate-limit integration tests
        run: node tests/trakt-network-integration.js
      - name: OAuth single-flight refresh tests
        run: node tests/trakt-oauth-singleflight.js
      - name: Sync history journal tests
        run: node tests/sync-history.js
      - name: Sidebar Sync Queue UI contract
        run: node tests/sidebar-sync-queue.js
      - name: Manual cross-type correction model
        run: node tests/correction-media.js
      - name: Manual type switch sidebar contract
        run: node tests/manual-correction-ui.js
      - name: Yastream manual S/E editor refresh regression
        run: node tests/manual-episode-editor-refresh.js
      - name: AIOStreams HLS metadata fragment parsing
        run: node tests/aiostreams-fragment.js
      - name: AIOStreams Poetic Justice movie and strict year validation
        run: node tests/aiostreams-movie.js
      - name: AIOStreams exact title and episode verification
        run: node tests/aiostreams-strict-match.js
      - name: AIOStreams duplicate-title exact S/E and resume preflight
        run: node tests/aiostreams-duplicate-title-episode.js
      - name: AIOStreams regional alias with strict episode title and year
        run: node tests/aiostreams-country-alias.js
      - name: MediaFusion episode route and manual pack cache regression
        run: node tests/mediafusion-identity.js
      - name: Playback identity diagnostic redaction tests
        run: node tests/playback-diagnostics.js
      - name: False-positive title resolution regression tests
        run: node tests/false-positive-matching.js
      - name: Verified replay and Needs Review UI contracts
        run: node tests/replay-integrity-ui.js
      - name: IINA Remove interaction and acknowledgment regression
        run: node tests/review-remove-interaction.js
      - name: Fresh IMDb/TMDB URL / Stremio identity tests
        run: node tests/fresh-identity.js
      - name: Trakt Fresh ID lookup verification
        run: node tests/fresh-trakt-resolution.js
      - name: First-playback async identity and UI contract
        run: node tests/fresh-integration-contract.js
      - name: Resume protection safety decisions
        run: node tests/resume-protection.js
      - name: Read-only Trakt resume preflight regression
        run: node tests/trakt-resume-preflight.js
      - name: IINA resume guard / sidebar contract
        run: node tests/resume-preflight-ui.js
      - name: DMM filename and redacted diagnostics regression
        run: node tests/dmm-filename.js
      - name: Parser smoke tests
        run: node tests/parser-smoke.js
      - name: Trakt resolution tests
        run: node tests/trakt-resolution.js
      - name: Strict show identity and cached remake regression
        run: node tests/night-manager-show-identity.js
