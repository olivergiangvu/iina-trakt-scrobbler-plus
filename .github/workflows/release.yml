name: Publish IINA plugin release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    name: Test, package and publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release source
        uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate release metadata
        id: version
        shell: bash
        run: |
          node - <<'NODE'
          const assert = require('node:assert/strict');
          const fs = require('node:fs');
          const info = JSON.parse(fs.readFileSync('Info.json', 'utf8'));
          assert.equal(info.ghRepo, 'olivergiangvu/iina-trakt-scrobbler-plus');
          assert.equal(info.identifier, 'io.github.olivergiangvu.iinatraktscrobblerplus');
          assert.ok(Number.isInteger(info.ghVersion) && info.ghVersion >= 1);
          assert.match(info.version, /^\d+\.\d+\.\d+(?:-beta\.\d+)?$/);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, 'version=' + info.version + '\n');
          fs.appendFileSync(process.env.GITHUB_OUTPUT, 'tag=v' + info.version + '\n');
          NODE

      - name: Syntax validation
        shell: bash
        run: |
          set -euo pipefail
          for module in main.js trakt.js stream-source.js playback-identity.js \
              mediafusion-identity.js correction-media.js playback-diagnostics.js \
              stop-journal.js sync-history.js trakt-api-gate.js monitor.js; do
            node --check "$module"
          done

      - name: Full regression suite
        shell: bash
        run: |
          set -euo pipefail
          for t in tests/*.js; do
            echo "RUN $t"
            node "$t"
          done

      - name: Stage and pack IINA plugin
        id: package
        shell: bash
        run: |
          set -euo pipefail
          STAGE="$(./scripts/stage-plugin.sh)"
          OUTPUT="$GITHUB_WORKSPACE/Trakt-Scrobbler-Plus-v${{ steps.version.outputs.version }}.iinaplgz"
          (
            cd "$STAGE"
            zip -q -r "$OUTPUT" .
          )
          unzip -t "$OUTPUT" >/dev/null
          unzip -Z1 "$OUTPUT" | grep -qx 'Info.json'
          unzip -Z1 "$OUTPUT" | grep -qx 'stream-source.js'
          unzip -Z1 "$OUTPUT" | grep -qx 'playback-identity.js'
          unzip -Z1 "$OUTPUT" | grep -qx 'stop-journal.js'
          unzip -Z1 "$OUTPUT" | grep -qx 'trakt-api-gate.js'
          unzip -Z1 "$OUTPUT" | grep -qx 'mediafusion-identity.js'
          unzip -Z1 "$OUTPUT" | grep -qx 'correction-media.js'
          unzip -Z1 "$OUTPUT" | grep -qx 'playback-diagnostics.js'
          unzip -Z1 "$OUTPUT" | grep -qx 'sync-history.js'
          unzip -Z1 "$OUTPUT" | grep -qx 'sidebar.html'
          unzip -Z1 "$OUTPUT" | grep -qx 'parser.iina.js'
          echo "path=$OUTPUT" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          ASSET: ${{ steps.package.outputs.path }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; increment Info.json version and ghVersion for the next release."
            exit 0
          fi
          if [[ "$TAG" == *-* ]]; then
            RELEASE_CHANNEL="Beta"
            RELEASE_ARGS=(--prerelease)
          else
            RELEASE_CHANNEL="Stable"
            RELEASE_ARGS=(--latest)
          fi
          cat > release-notes.md <<'NOTES'
          ## Trakt Scrobbler Plus v0.2.4 — Stable
          - Validated on IINA/macOS: direct and cached MediaFusion matching, TV manual correction,
            S/E validation, Trakt scrobble, ⌘Q stop and resume through the existing bridge.
          - Match Provenance and Copy Diagnostics without leaking stream URLs or auth secrets.
          - Sync Queue shows verified Pending/Syncing, Recently Synced and Needs Review
            for legacy unverified checkpoints. Explicit two-step local Remove confirmation.
          - Trakt API request pacing, backoff and offline recovery preserved from v0.2.3.
          - All source tests and archive package contents validated by CI.
          - Pace and serialize Trakt write requests; recognize HTTP 429 and Cloudflare 1015 with persisted bounded cooldown.
          - Collapse sidebar refresh requests, preserve cached history/profile when offline and recover saved stop checkpoints without reboot.
          - Retry interrupted Trakt stop updates after the next IINA launch, retaining resume progress or watched status.
          - Retain mpv filename and multilingual episode recognition fixes.
          - Fix Manual Search / Trakt slug lookup; choose season and episode before applying a verified match.
          - IMDb-first Trakt lookup with episode verification, while keeping existing guessit file parsing as fallback.
          - Independent IINA plugin ID and authentication storage from upstream.
          - Source and code credits: i3p9/iina-trakt-scrobbler (GPL-3.0), inspired by Zain-Imam/iina-episode-info (MIT).

          **Install/update on Mac:** IINA → Settings → Plugins → Install from GitHub → `olivergiangvu/iina-trakt-scrobbler-plus`.
          v0.2.4 is promoted from user-tested v0.2.4-beta.6. Playback and Trakt API logic remain unchanged from beta.6. HomeDocker Trakt Bridge is not modified.
          Keep the original Trakt plugin's scrobbling disabled to prevent duplicate playback events.
          Fresh TMDB/IMDb-first series recognition without prior IDs remains a future development.
          NOTES
          # Keep pre-releases visible as canaries without silently replacing
          # the latest stable distribution used by IINA.
          gh release create "$TAG" "$ASSET" \
            --target "$GITHUB_SHA" \
            --title "$TAG — $RELEASE_CHANNEL" \
            --notes-file release-notes.md \
            "${RELEASE_ARGS[@]}"
