name: Publish IINA plugin release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    name: Test, package and publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release source
        uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate release metadata and versioned notes
        id: version
        shell: bash
        run: |
          node - <<'NODE'
          const assert = require('node:assert/strict');
          const fs = require('node:fs');
          const info = JSON.parse(fs.readFileSync('Info.json', 'utf8'));
          assert.equal(info.ghRepo, 'olivergiangvu/iina-trakt-scrobbler-plus');
          assert.equal(info.identifier, 'io.github.olivergiangvu.iinatraktscrobblerplus');
          assert.ok(Number.isInteger(info.ghVersion) && info.ghVersion >= 1);
          assert.match(info.version, /^\d+\.\d+\.\d+(?:-beta\.\d+)?$/);
          const notes = 'docs/releases/v' + info.version + '.md';
          assert.ok(fs.existsSync(notes), 'Missing release notes for ' + info.version);
          const content = fs.readFileSync(notes, 'utf8');
          assert.ok(content.length >= 200, 'Release notes must be substantive');
          assert.ok(content.includes('v' + info.version), 'Release notes version mismatch');
          assert.ok(!content.includes('v0.2.4 — Stable\n- Validated'), 'Stale v0.2.4 release notes');
          assert.ok(info.version !== '0.2.5' || info.ghVersion === 20,
            'v0.2.5 must have ghVersion 20 to update beta.7');
          assert.ok(info.version !== '0.2.6' || info.ghVersion === 23,
            'v0.2.6 must have ghVersion 23 to update beta.2');
          assert.ok(info.version !== '0.2.7' || info.ghVersion === 26,
            'v0.2.7 must have ghVersion 26 to update beta.2');
          assert.ok(fs.readFileSync('main.js', 'utf8').includes(
            'var PLUGIN_VERSION = "' + info.version + '";'), 'main.js version mismatch');
          fs.appendFileSync(process.env.GITHUB_OUTPUT, 'version=' + info.version + '\n');
          fs.appendFileSync(process.env.GITHUB_OUTPUT, 'tag=v' + info.version + '\n');
          fs.appendFileSync(process.env.GITHUB_OUTPUT, 'notes=' + notes + '\n');
          NODE

      - name: Syntax validation
        shell: bash
        run: |
          set -euo pipefail
          for module in main.js aio-companion-callback.js trakt.js debug-log-buffer.js stream-source.js \
              playback-identity.js aiostreams-fragment.js fresh-identity.js resume-protection.js \
              mediafusion-identity.js correction-media.js playback-diagnostics.js \
              stop-journal.js sync-history.js trakt-api-gate.js monitor.js; do
            node --check "$module"
          done

      - name: Full regression suite
        shell: bash
        run: |
          set -euo pipefail
          for t in tests/*.js; do
            echo "RUN $t"
            node "$t"
          done

      - name: Stage and pack IINA plugin
        id: package
        shell: bash
        run: |
          set -euo pipefail
          STAGE="$(./scripts/stage-plugin.sh)"
          OUTPUT="$GITHUB_WORKSPACE/Trakt-Scrobbler-Plus-v${{ steps.version.outputs.version }}.iinaplgz"
          (
            cd "$STAGE"
            zip -q -r "$OUTPUT" .
          )
          unzip -t "$OUTPUT" >/dev/null
          for module in Info.json main.js aio-companion-callback.js trakt.js debug-log-buffer.js \
              stream-source.js playback-identity.js aiostreams-fragment.js fresh-identity.js \
              resume-protection.js stop-journal.js trakt-api-gate.js \
              mediafusion-identity.js correction-media.js \
              playback-diagnostics.js sync-history.js monitor.js \
              sidebar.html preferences.html parser.iina.js; do
            unzip -Z1 "$OUTPUT" | grep -Fxq "$module"
          done
          ARCHIVE_VERSION="$(unzip -p "$OUTPUT" Info.json | node -e \
            'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>process.stdout.write(JSON.parse(s).version))')"
          test "$ARCHIVE_VERSION" = "${{ steps.version.outputs.version }}"
          echo "path=$OUTPUT" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          ASSET: ${{ steps.package.outputs.path }}
          RELEASE_NOTES: ${{ steps.version.outputs.notes }}
        shell: bash
        run: |
          set -euo pipefail
          test -s "$RELEASE_NOTES"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; to ship changes bump both version and ghVersion."
            exit 0
          fi
          if [[ "$TAG" == *-* ]]; then
            RELEASE_CHANNEL="Beta"
            RELEASE_ARGS=(--prerelease)
          else
            RELEASE_CHANNEL="Stable"
            RELEASE_ARGS=(--latest)
          fi
          gh release create "$TAG" "$ASSET" \
            --target "$GITHUB_SHA" \
            --title "$TAG — $RELEASE_CHANNEL" \
            --notes-file "$RELEASE_NOTES" \
            "${RELEASE_ARGS[@]}"
