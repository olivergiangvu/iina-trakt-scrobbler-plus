name: Publish v0.2.4 canary prerelease

# Archived canary publishing workflow. Manual dispatch only; do not publish
# old beta tags when preparing a stable release from the same branch.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prerelease:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout canary branch
        uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check version and isolated canary metadata
        shell: bash
        run: |
          node - <<'NODE'
          const assert = require('node:assert/strict');
          const info = require('./Info.json');
          assert.equal(info.identifier, 'io.github.olivergiangvu.iinatraktscrobblerplus');
          assert.equal(info.ghRepo, 'olivergiangvu/iina-trakt-scrobbler-plus');
          assert.equal(info.version, '0.2.4-beta.6');
          assert.equal(info.ghVersion, 11);
          NODE

      - name: Syntax and complete test suite
        shell: bash
        run: |
          set -euo pipefail
          node --check main.js
          node --check trakt.js
          node --check mediafusion-identity.js
          node --check correction-media.js
          node --check sync-history.js
          node --check stop-journal.js
          node --check trakt-api-gate.js
          for t in tests/*.js; do
            echo "RUN $t"
            node "$t"
          done

      - name: Stage and package IINA extension
        shell: bash
        run: |
          set -euo pipefail
          STAGE="$(./scripts/stage-plugin.sh)"
          ASSET="$GITHUB_WORKSPACE/Trakt-Scrobbler-Plus-v0.2.4-beta.6.iinaplgz"
          (
            cd "$STAGE"
            zip -q -r "$ASSET" .
          )
          unzip -t "$ASSET" > /dev/null
          for path in Info.json main.js sidebar.html stop-journal.js \
                      sync-history.js trakt-api-gate.js playback-identity.js playback-diagnostics.js mediafusion-identity.js correction-media.js parser.iina.js; do
            unzip -Z1 "$ASSET" | grep -qx "$path"
          done
          echo "ASSET=$ASSET" >> "$GITHUB_ENV"

      - name: Publish prerelease (do not change latest stable)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="v0.2.4-beta.6"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "$TAG already exists; no destructive asset overwrite"
            exit 0
          fi
          cat > notes.md <<'NOTES'
          # Trakt Scrobbler Plus v0.2.4-beta.6 — Sync Queue Canary

          - Visible match provenance: Manual, IMDb, Trakt-confirmed, confirmed MediaFusion torrent cache, or unverified.
          - Legacy unmatched stops moved to Needs Review, not auto-replayed or silently deleted.
          - Verified final stops carry safe Trakt ID proof and are revalidated on retry.
          - Fixed IINA Remove action: pointerdown / click / keyboard support with no double-send.\n          - Explicit Confirm remove / Cancel, wrapped labels, and success/error feedback.\n          - Unverified LOCAL stops may be removed during playback; Trakt history untouched.
          - Pending / Syncing / Recently Synced final-stop dashboard.
          - Reject incorrect high-scoring Trakt title matches (e.g. Strom ozvěny vs Gegen den Strom).
          - Redacted Copy Diagnostics button for MediaFusion / TorBox stream URLs.
          - Manual correction now supports explicit Movie / TV Series search mode, regardless of parser guess.
          - TV mode offers Season/Episode fields and verifies selected series episode on Trakt.
          - Use MediaFusion season/episode route to avoid treating localized episode titles as movies.
          - Require a trusted show ID or manual match before any scrobble; remember user-confirmed show for matching torrent/season without storing stream credentials.
          - Safe **Retry Now** button: respects Trakt cooldown, network connectivity,
            authentication, playback state and active sync guard.
          - Local last-confirmed-stop audit with a 12-item / 7-day cap;
            no stream URLs or OAuth secrets recorded.
          - More informative Last API Error status, while retaining
            v0.2.3 match, watched, resume and ⌘Q reliability.

          **Beta install on Mac:** download the .iinaplgz asset below and open it
          with IINA. Restart IINA. No Terminal and no HomeDocker changes.

          The Latest Stable GitHub release remains **v0.2.3**. Installing from
          GitHub in IINA can select stable rather than this prerelease.

          Validate Pending/Syncing/Recently Synced, Retry lockouts and existing
          HomeDocker Trakt Bridge propagation before promoting beta to stable.
          NOTES
          gh release create "$TAG" "$ASSET" \
            --target "$GITHUB_SHA" \
            --title "$TAG — Canary beta" \
            --notes-file notes.md \
            --prerelease
