name: Publish Trakt+ verified-identity beta

on:
  push:
    branches: ['fix/verified-episode-identity-20261113']
    paths:
      - Info.json
      - .github/workflows/publish-identity-beta.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: trakt-verified-identity-beta
  cancel-in-progress: false

jobs:
  beta:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify beta identity and run full regression suite
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const assert=require('node:assert/strict');
          const i=require('./Info.json');
          assert.equal(i.version,'0.2.9-beta.7');
          assert.equal(i.ghVersion,36);
          assert.equal(i.ghRepo,'olivergiangvu/iina-trakt-scrobbler-plus');
          NODE
          node --check main.js
          node --check trakt.js
          for test in tests/*.js; do node "$test"; done
      - name: Package installable IINA beta
        shell: bash
        run: |
          set -euo pipefail
          STAGE="$(./scripts/stage-plugin.sh)"
          ASSET="Trakt-Scrobbler-Plus-v0.2.9-beta.7.iinaplgz"
          ( cd "$STAGE" && zip -q -r "$GITHUB_WORKSPACE/$ASSET" . )
          unzip -tq "$ASSET"
          for name in Info.json main.js trakt.js trusted-series-aliases.js aio-identity-sidecar.js sidebar.html; do
            unzip -Z1 "$ASSET" | grep -qx "$name"
          done
          sha256sum "$ASSET" > SHA256SUMS.txt
      - name: Publish versioned prerelease (Stable stays unchanged)
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG=v0.2.9-beta.7
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "ERROR: tag already published; never overwrite an immutable beta" >&2
            exit 1
          fi
          gh release create "$TAG" \
            Trakt-Scrobbler-Plus-v0.2.9-beta.7.iinaplgz SHA256SUMS.txt \
            --target "$GITHUB_SHA" --title "Trakt+ $TAG — Identity beta" \
            --notes "Beta for direct IINA field testing. Fixes stale negative identity cache, preserves same-title different-year confirmations, verifies each S/E independently and consumes optional authenticated AIO Companion sidecars. Only Trakt+ writes to Trakt. Install the .iinaplgz directly in IINA. Stable v0.2.9 and its release remain unchanged; roll back using the prior GitHub release." \
            --prerelease --latest=false
