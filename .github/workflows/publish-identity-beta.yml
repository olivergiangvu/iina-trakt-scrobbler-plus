name: Publish Trakt+ verified-identity beta

on:
  push:
    branches: ['fix/verified-episode-identity-20261113']
    paths:
      - Info.json
      - .github/workflows/publish-identity-beta.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: trakt-verified-identity-beta
  cancel-in-progress: false

jobs:
  beta:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify beta identity and run full regression suite
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const assert=require('node:assert/strict');
          const i=require('./Info.json');
          assert.equal(i.version,'0.2.9-beta.9');
          assert.equal(i.ghVersion,38);
          assert.equal(i.ghRepo,'olivergiangvu/iina-trakt-scrobbler-plus');
          NODE
          node --check main.js
          node --check trakt.js
          for test in tests/*.js; do node "$test"; done
      - name: Package installable IINA beta
        shell: bash
        run: |
          set -euo pipefail
          STAGE="$(./scripts/stage-plugin.sh)"
          ASSET="Trakt-Scrobbler-Plus-v0.2.9-beta.9.iinaplgz"
          ( cd "$STAGE" && zip -q -r "$GITHUB_WORKSPACE/$ASSET" . )
          unzip -tq "$ASSET"
          for name in Info.json main.js trakt.js trusted-series-aliases.js aio-identity-sidecar.js sidebar.html; do
            unzip -Z1 "$ASSET" | grep -qx "$name"
          done
          sha256sum "$ASSET" > SHA256SUMS.txt
      - name: Publish versioned prerelease (Stable stays unchanged)
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG=v0.2.9-beta.9
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "ERROR: tag already published; never overwrite an immutable beta" >&2
            exit 1
          fi
          gh release create "$TAG" \
            Trakt-Scrobbler-Plus-v0.2.9-beta.9.iinaplgz SHA256SUMS.txt \
            --target "$GITHUB_SHA" --title "Trakt+ $TAG — Identity beta" \
            --notes "Beta for direct IINA field testing. Resolves yearless same-title S/E episodes (Fired Up! 1997/2026) when Trakt extended=full metadata and actual IINA video duration prove exactly one close runtime; unknown or similar runtimes still fail closed. Defers yearless resume verification until IINA knows playback duration. Runtime-based cache is constrained to S/E, CDN and duration. Retains safe Correct Match learning and authenticated AIO sidecars; diagnostics reports this beta version. Trakt+ remains the sole Trakt writer; Stable v0.2.9 untouched. Install the .iinaplgz directly, rollback via GitHub release." \
            --prerelease --latest=false
