name: Publish Trakt+ IPTV EPG beta

on:
  push:
    branches: ['feat/trakt-iptv-epg-display-20261115']
    paths:
      - '.github/workflows/publish-iptv-epg-beta.yml'
      - 'Info.json'
      - 'main.js'
      - 'aio-identity-sidecar.js'

permissions:
  contents: write

concurrency:
  group: trakt-iptv-epg-beta
  cancel-in-progress: false

jobs:
  beta:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify beta version and full regression suite
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const assert = require('node:assert/strict');
          const info = require('./Info.json');
          assert.equal(info.version, '0.2.9-beta.11');
          assert.equal(info.ghVersion, 40);
          assert.equal(info.ghRepo, 'olivergiangvu/iina-trakt-scrobbler-plus');
          NODE
          for module in main.js trakt.js aio-identity-sidecar.js; do node --check "$module"; done
          for test in tests/*.js; do node "$test"; done
      - name: Package installable IINA beta
        shell: bash
        run: |
          set -euo pipefail
          STAGE="$(./scripts/stage-plugin.sh)"
          ASSET="Trakt-Scrobbler-Plus-v0.2.9-beta.11.iinaplgz"
          ( cd "$STAGE" && zip -q -r "$GITHUB_WORKSPACE/$ASSET" . )
          unzip -tq "$ASSET"
          for name in Info.json main.js trakt.js aio-identity-sidecar.js sidebar.html; do
            unzip -Z1 "$ASSET" | grep -qx "$name"
          done
          sha256sum "$ASSET" > SHA256SUMS.txt
      - name: Publish immutable prerelease without touching Stable
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG=v0.2.9-beta.11
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "ERROR: beta already exists; refusing to overwrite" >&2
            exit 1
          fi
          gh release create "$TAG" \
            Trakt-Scrobbler-Plus-v0.2.9-beta.11.iinaplgz SHA256SUMS.txt \
            --target "$GITHUB_SHA" --title "Trakt+ $TAG — IPTV EPG beta" \
            --notes "Field-test beta for AIOStreams Live TV/Catch-up in IINA. Shows verified channel/programme/airtime from the AIO-IINA Companion EPG sidecar; prevents numeric Xtream filenames such as 100450.ts from being treated as Trakt movies. IPTV EPG stays display-only: no automatic Trakt scrobble. Keeps VOD identity, resumes and subtitle handling. Install directly in IINA and keep a backup of the previous plugin. Stable and its auto-update channel are unchanged." \
            --prerelease --latest=false
