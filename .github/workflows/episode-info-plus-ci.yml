name: Episode Info Plus beta validation
on:
  push:
    branches:
      - episode-info-plus-staging
  workflow_dispatch:
jobs:
  smoke-and-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: JavaScript syntax
        run: |
          node --check main.js
          node --check episode-plus-identity.js
      - name: Identity, theme and sidebar syntax fixtures
        run: node tests/episode-plus-identity.test.js
      - name: Build IINA install package
        run: |
          mkdir -p dist
          zip -q -r dist/Episode-Info-Plus-v0.1.0-beta.1.iinaplgz \
            Info.json main.js episode-plus-identity.js sidebar.html overlay.html LICENSE
          unzip -t dist/Episode-Info-Plus-v0.1.0-beta.1.iinaplgz
      - uses: actions/upload-artifact@v4
        with:
          name: Episode-Info-Plus-v0.1.0-beta.1
          path: dist/Episode-Info-Plus-v0.1.0-beta.1.iinaplgz
          if-no-files-found: error
          retention-days: 30
